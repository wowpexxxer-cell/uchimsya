<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Учимся играя</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Азбука и счёт для малышей: буквы, письмо пальчиком и игры">
  <meta name="theme-color" content="#BEE6FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Учимся">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="sun"></span>
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
    <svg class="hills" viewBox="0 0 1440 260" preserveAspectRatio="none">
      <path d="M0 150 C220 70 420 80 640 140 C860 200 1100 90 1440 120 L1440 260 L0 260 Z" fill="#A8E0A0"/>
      <path d="M0 200 C260 130 520 170 760 200 C1000 230 1220 160 1440 180 L1440 260 L0 260 Z" fill="#7FCF7A"/>
    </svg>
  </div>
  <div id="app">
    <header class="bar">
      <button class="round-btn" id="back" aria-label="Назад" hidden></button>
      <h2 id="title">Учимся играя</h2>
      <div class="prog" id="prog" hidden><i></i></div>
      <button class="who" id="who" aria-label="Для родителей" hidden></button>
      <div class="stars" id="stars" aria-label="Звёздочки" hidden><span class="star">★</span><span id="stars-num">0</span></div>
    </header>
    <main id="view"></main>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="js/data.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
